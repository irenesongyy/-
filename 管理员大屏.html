<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>盟浪 — 管理员数据可视化大屏</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<style>
/* ============================================
   盟浪管理员大屏 — Red Theme Dashboard
   ============================================ */
:root {
  --bg-deep: #FFFAFA;
  --bg-primary: #FFFBFA;
  --bg-panel: #FFFFFF;
  --bg-card: #FFFFFF;
  --bg-card-alt: #FFF6F5;

  --brand-red: #DF0029;
  --brand-red-bright: #FF1A3F;
  --brand-red-deep: #B80020;
  --brand-red-glow: #FF3050;
  --brand-gold: #CCAA44;
  --brand-gold-light: #DDBB55;

  --text-primary: #2D1820;
  --text-secondary: #6B4A52;
  --text-muted: #A88890;
  --text-bright: #3D1825;

  --border-card: #F0D0D5;
  --border-active: #DF0029;
  --border-gold: #CCAA4444;

  --shadow-card: 0 1px 6px rgba(0,0,0,0.04);
  --shadow-glow: 0 0 20px rgba(223,0,41,0.08);

  --header-height: 56px;
  --content-pad: 12px;
  --card-radius: 8px;
  --card-gap: 12px;
}

* { margin:0; padding:0; box-sizing:border-box; }

html, body {
  height: 100%; width: 100%; overflow-x: hidden; overflow-y: auto;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
  font-size: 13px; color: var(--text-primary); background: var(--bg-primary);
  -webkit-font-smoothing: antialiased;
}

/* ============================================ HEADER / TOP NAV — Banner Style ============================================ */
:root {
  --header-total-height: 110px;
}

.dashboard-header {
  position: fixed; top: 0; left: 0; right: 0; height: var(--header-total-height);
  background: #C8102E;
  z-index: 1000;
  display: flex; flex-direction: column;
}

/* ── Top Row: Logo + Search + User ── */
.header-top-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 32px; height: 60px;
}
.header-left {
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0; cursor: pointer;
}
.header-logo {
  width: 38px; height: 38px; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
}
.header-logo svg { width: 38px; height: 38px; }
.header-logo-text {
  display: flex; flex-direction: column;
}
.header-logo-sub {
  font-size: 10px; font-weight: 700; color: rgba(255,255,255,0.85);
  letter-spacing: 2px; line-height: 1;
}
.header-title {
  font-size: 16px; font-weight: 600; color: #FFFFFF;
  letter-spacing: 2px; line-height: 1.4; white-space: nowrap;
}
.header-title-sub {
  font-size: 11px; font-weight: 400; color: rgba(255,255,255,0.82);
  letter-spacing: 1px; line-height: 1.2; white-space: nowrap;
}

/* Search */
.header-search-wrap {
  flex: 1; display: flex; align-items: center;
  max-width: 520px; min-width: 280px;
  margin: 0 24px;
}
.header-search-input {
  flex: 1; height: 36px; border: none; border-radius: 4px 0 0 4px;
  padding: 0 14px; font-size: 13px; color: #333; outline: none;
  font-family: inherit;
}
.header-search-input::placeholder { color: #A9A9A9; }
.header-search-btn {
  height: 36px; padding: 0 20px; border: none; border-radius: 0 4px 4px 0;
  background: #222831; color: #FFFFFF; font-size: 13px; font-weight: 600;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.header-search-btn:hover { background: #1a1f27; }

/* User area */
.header-user-area {
  display: flex; align-items: center; gap: 10px;
  flex-shrink: 0; cursor: pointer;
}
.header-avatar {
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(255,255,255,0.2);
  display: flex; align-items: center; justify-content: center;
}
.header-avatar svg { width: 18px; height: 18px; }
.header-phone {
  font-size: 13px; color: #FFFFFF; font-weight: 400;
  letter-spacing: 1px;
}

/* ── Bottom Row: Nav Links ── */
.header-nav-row {
  height: 50px; display: flex; align-items: center; justify-content: space-evenly;
  padding: 0 32px; border-top: 1px solid rgba(255,255,255,0.12);
}
.nav-link {
  padding: 8px 20px; font-size: 14px; color: rgba(255,255,255,0.88);
  cursor: pointer; text-decoration: none; user-select: none;
  transition: all 0.15s ease; white-space: nowrap;
  border-radius: 4px; position: relative;
}
.nav-link:hover { color: #FFFFFF; background: rgba(255,255,255,0.08); }
.nav-link.active {
  color: #FFFFFF; font-weight: 600;
}
.nav-link.active::after {
  content: ''; position: absolute; bottom: -4px; left: 20px; right: 20px;
  height: 2px; background: #FFFFFF; border-radius: 1px;
}

/* Hide legacy header elements */
.header-bg-line, .header-center, .header-tagline,
.header-time, .header-role, .nav-links, .nav-item,
.nav-dropdown, .nav-actions, .nav-user-profile, .nav-user-info,
.nav-user-name, .nav-user-role-text, .nav-role-tag,
.nav-time, .nav-link .arrow, .nav-link svg { display: none; }

/* Page offset for fixed nav */
.page-container {
  padding-top: var(--header-total-height);
}

/* ============================================ MAIN CONTENT ============================================ */
.dashboard-body {
  min-height: calc(100vh - var(--header-total-height));
  padding: var(--content-pad);
  display: flex; flex-direction: column; gap: var(--card-gap);
}

/* ---- KPI Row ---- */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: var(--card-gap);
  flex-shrink: 0;
}
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border-card);
  border-radius: var(--card-radius);
  padding: 14px 18px;
  position: relative; overflow: hidden;
  transition: border-color 0.3s;
}
.kpi-card:hover { border-color: var(--border-active); }
.kpi-card::before {
  content: ''; position: absolute; top: 0; left: 0; width: 3px; height: 100%;
  background: linear-gradient(180deg, var(--brand-red-bright), var(--brand-red-deep));
  border-radius: 3px 0 0 3px;
}
.kpi-label {
  font-size: 11px; color: var(--text-muted); margin-bottom: 6px;
  letter-spacing: 1px;
}
.kpi-value {
  font-size: 30px; font-weight: 700; color: var(--text-bright);
  font-variant-numeric: tabular-nums; line-height: 1.1;
}
.kpi-value .unit { font-size: 13px; font-weight: 400; color: var(--text-muted); margin-left: 2px; }
.kpi-sub {
  font-size: 10px; color: var(--text-muted); margin-top: 4px;
  display: flex; align-items: center; gap: 4px;
}
.kpi-sub .up { color: #DF0029; }
.kpi-sub .down { color: #4CAF50; }

/* ---- Content Grid ---- */
.content-grid {
  display: grid;
  grid-template-columns: 1fr 1.6fr 1fr;
  gap: var(--card-gap);
  min-height: 520px;
}

/* ---- Panels ---- */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border-card);
  border-radius: var(--card-radius);
  display: flex; flex-direction: column;
  overflow: hidden;
}
.panel-header {
  padding: 10px 14px; border-bottom: 1px solid var(--border-card);
  display: flex; align-items: center; gap: 8px;
  flex-shrink: 0;
  background: var(--bg-card-alt);
}
.panel-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--brand-red-bright);
  box-shadow: 0 0 6px rgba(223,0,41,0.30);
}
.panel-title {
  font-size: 13px; font-weight: 600; color: var(--text-primary);
  letter-spacing: 0.5px;
}
.panel-body {
  flex: 1; min-height: 0; overflow: hidden;
  position: relative;
}
.panel-chart {
  width: 100%; height: 100%;
}

/* ---- Left Column ---- */
.left-col {
  display: flex; flex-direction: column; gap: var(--card-gap);
}
.left-col .panel { flex: 1; min-height: 220px; }

/* ---- Right Column ---- */
.right-col {
  display: flex; flex-direction: column; gap: var(--card-gap);
}
.right-col .panel { flex: 1; min-height: 220px; }

/* ---- Center Map Panel ---- */
.map-panel {
  border-color: var(--border-active);
  box-shadow: 0 0 16px rgba(223,0,41,0.06);
}
.map-panel .panel-header {
  border-bottom-color: var(--border-active);
}
.map-panel .panel-dot {
  background: var(--brand-gold);
  box-shadow: 0 0 8px rgba(204,170,68,0.5);
}

/* ============================================ TOP10 TABLE ============================================ */
.top10-table {
  width: 100%; border-collapse: collapse; font-size: 11px;
}
.top10-table th {
  text-align: left; padding: 5px 8px;
  color: var(--text-muted); font-weight: 400;
  border-bottom: 1px solid var(--border-card);
  font-size: 10px; letter-spacing: 0.5px;
}
.top10-table td {
  padding: 5px 8px; color: var(--text-secondary);
  border-bottom: 1px solid rgba(240,223,226,0.8);
}
.top10-table tr:hover td { background: rgba(223,0,41,0.04); color: var(--text-primary); }
.top10-table .rank-col { width: 26px; text-align: center; }
.top10-table .rank-badge {
  display: inline-block; width: 18px; height: 18px; line-height: 18px;
  border-radius: 4px; text-align: center; font-size: 10px; font-weight: 600;
  background: rgba(223,0,41,0.10); color: var(--brand-red);
}
.top10-table .rank-badge.top3 { background: var(--brand-red); color: #fff; }
.top10-table .bar-cell {
  position: relative;
}
.top10-table .bar-fill {
  position: absolute; left: 0; top: 50%; transform: translateY(-50%);
  height: 4px; border-radius: 2px;
  background: linear-gradient(90deg, rgba(223,0,41,0.10), rgba(223,0,41,0.20));
  opacity: 1;
}

/* ============================================ PROVINCE RANK TABLE ============================================ */
.province-table {
  width: 100%; border-collapse: collapse; font-size: 11px;
}
.province-table th {
  text-align: left; padding: 4px 8px;
  color: var(--text-muted); font-weight: 400;
  border-bottom: 1px solid var(--border-card);
  font-size: 10px;
}
.province-table td {
  padding: 3px 8px; color: var(--text-secondary);
  border-bottom: 1px solid rgba(240,223,226,0.8);
}
.province-table tr:hover td { background: rgba(223,0,41,0.04); }

/* ============================================ SCROLLBAR ============================================ */
::-webkit-scrollbar { width: 3px; height: 3px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(223,0,41,0.15); border-radius: 2px; }

/* ============================================ CORNER DECORATIONS ============================================ */
.corner-decoration {
  position: absolute; pointer-events: none; z-index: 0;
  width: 12px; height: 12px; opacity: 0.6;
}
.corner-tl { top: 0; left: 0; border-top: 1px solid var(--border-active); border-left: 1px solid var(--border-active); }
.corner-tr { top: 0; right: 0; border-top: 1px solid var(--border-active); border-right: 1px solid var(--border-active); }
.corner-bl { bottom: 0; left: 0; border-bottom: 1px solid var(--border-active); border-left: 1px solid var(--border-active); }
.corner-br { bottom: 0; right: 0; border-bottom: 1px solid var(--border-active); border-right: 1px solid var(--border-active); }
</style>
</head>

// ============================================
// POPULATE TABLES

// TOP10 Table
(function populateTop10() {
  const tbody = $('top10TableBody');
  const maxCalls = top10Enterprises[0].calls;
  top10Enterprises.forEach((e, i) => {
    const barW = (e.calls / maxCalls * 100).toFixed(0);
    const rankCls = i < 3 ? ' top3' : '';
    tbody.innerHTML += `
      <tr>
        <td class="rank-col"><span class="rank-badge${rankCls}">${i+1}</span></td>
        <td>${e.name}</td>
        <td>${e.province}</td>
        <td class="bar-cell">
          <div class="bar-fill" style="width:${barW}%"></div>
          <span style="position:relative;z-index:1;">${e.calls.toLocaleString()}</span>
        </td>
        <td>${e.pct}</td>
      </tr>`;
  });
})();

// Province Rank Table (top 15)
(function populateProvinceRank() {
  const tbody = $('provinceRankBody');
  const sorted = provinces
    .filter(p => provinceData[p] && provinceData[p].cert > 0)
    .sort((a,b) => provinceData[b].cert - provinceData[a].cert)
    .slice(0, 15);
  const maxCert = provinceData[sorted[0]].cert;
  sorted.forEach((p, i) => {
    const d = provinceData[p];
    const pct = (d.cert / 3218 * 100).toFixed(1);
    tbody.innerHTML += `
      <tr>
        <td style="width:22px;text-align:center;color:${i<3?'var(--brand-red-bright)':'var(--text-muted)'};font-weight:600;">${i+1}</td>
        <td>${p}</td>
        <td>${d.cert}</td>
        <td>${pct}%</td>
      </tr>`;
  });
})();

// ============================================
// CHARTS
// ============================================

// ---- Average Calls per Province (Horizontal Bar) ----
(function chartAvgCalls() {
  const sorted = provinces
    .filter(p => provinceData[p] && provinceData[p].avgCalls > 0)
    .sort((a,b) => provinceData[a].avgCalls - provinceData[b].avgCalls)
    .slice(-12); // top 12
  const chart = echarts.init($('chartAvgCalls'));
  chart.setOption({
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, textStyle: { fontSize: 11 } },
    grid: { left: 70, right: 30, top: 8, bottom: 8 },
    xAxis: {
      type: 'value', name: '万次', nameTextStyle: { color: textColor, fontSize: 10 },
      axisLine: { lineStyle: { color: axisLineColor } },
      axisTick: { show: false },
      splitLine: { lineStyle: { color: splitLineColor, type: 'dashed' } },
      axisLabel: { color: textColor, fontSize: 9 },
    },
    yAxis: {
      type: 'category',
      data: sorted.map(p => p.length > 3 ? p : p), // keep province names short
      inverse: true,
      axisLine: { show: false },
      axisTick: { show: false },
      axisLabel: { color: textColor, fontSize: 10 },
    },
    series: [{
      type: 'bar',
      data: sorted.map(p => ({
        value: provinceData[p].avgCalls,
        itemStyle: {
          borderRadius: [0, 3, 3, 0],
          color: new echarts.graphic.LinearGradient(0, 0, 1, 0, [
            { offset: 0, color: '#FFCCD2' },
            { offset: 1, color: '#DF0029' }
          ])
        }
      })),
      barWidth: 12,
      label: { show: true, position: 'right', color: textColor, fontSize: 9,
        formatter: p => p.value.toFixed(1) }
    }]
  });
  window.addEventListener('resize', () => chart.resize());
})();

// ---- CHINA MAP ----
(function chartChinaMap() {
  const mapContainer = $('chartChinaMap');
  const chart = echarts.init(mapContainer);

  // Show loading
  chart.showLoading({ text: '加载地图数据...', color: '#DF0029', textColor: '#2D1820', maskColor: 'rgba(255,255,255,0.9)' });

  // Fetch China GeoJSON from DataV
  fetch('https://geo.datav.aliyun.com/areas_v3/bound/100000_full.json')
    .then(r => r.json())
    .then(geoJson => {
      chart.hideLoading();
      echarts.registerMap('china', geoJson);

      // Build map series data
      const mapData = provinces
        .filter(p => provinceData[p])
        .map(p => ({
          name: p,
          value: provinceData[p].cert
        }));

      chart.setOption({
        tooltip: {
          trigger: 'item',
          backgroundColor: 'rgba(255,255,255,0.95)',
          borderColor: '#DF0029',
          textStyle: { color: '#3D2028', fontSize: 12 },
          formatter: function(params) {
            if (params.name && provinceData[params.name]) {
              const d = provinceData[params.name];
              return `<strong>${params.name}</strong><br/>
                认证企业：${d.cert} 家<br/>
                绿色认证：${d.green} 家<br/>
                平均调用：${d.avgCalls} 万次`;
            }
            return params.name + '<br/>暂无数据';
          }
        },
        visualMap: {
          min: 0, max: 500,
          left: 10, bottom: 16,
          text: ['高', '低'],
          textStyle: { color: textColor, fontSize: 10 },
          inRange: {
            color: ['#FFF0F0', '#FFB3BB', '#FF6677', '#FF1A3F', '#DF0029', '#B80020']
          },
          calculable: true,
          itemWidth: 10, itemHeight: 90,
        },
        geo: {
          map: 'china',
          roam: true,
          zoom: 1.18,
          center: [104.5, 36],
          label: {
            show: false,
            fontSize: 9,
            color: '#B8A8A5'
          },
          emphasis: {
            label: { show: true, fontSize: 12, color: '#3D2028' },
            itemStyle: {
              areaColor: '#FF1A3F',
              shadowBlur: 20,
              shadowColor: 'rgba(223,0,41,0.35)'
            }
          },
          itemStyle: {
            areaColor: '#F8E8EA',
            borderColor: '#F5C8CE',
            borderWidth: 0.8
          }
        },
        series: [{
          name: '认证企业分布',
          type: 'map',
          map: 'china',
          geoIndex: 0,
          selectedMode: false,
          data: mapData
        }]
      });

      // After option set, handle click: brief red flash, then reset
      chart.off('click');
      chart.on('click', function(params) {
        if (params.name && provinceData[params.name]) {
          // Dispatch a temporary emphasis update to flash red, then reset
          chart.dispatchAction({ type: 'highlight', seriesIndex: 0, name: params.name });
          setTimeout(function() {
            chart.dispatchAction({ type: 'downplay', seriesIndex: 0, name: params.name });
          }, 200);
        }
      });

      // Also reset on map roaming so emphasis doesn't persist
      chart.on('georoam', function() {
        chart.dispatchAction({ type: 'downplay', seriesIndex: 0 });
      });
    })
    .catch(err => {
      chart.hideLoading();
      // Fallback: show message on map area
      chart.setOption({
        title: {
          text: '地图数据加载失败\n请检查网络连接',
          left: 'center', top: 'center',
          textStyle: { color: '#A88890', fontSize: 14, lineHeight: 24 }
        }
      });
      console.error('Failed to load China map GeoJSON:', err);
    });

  window.addEventListener('resize', () => chart.resize());
})();
</script>
